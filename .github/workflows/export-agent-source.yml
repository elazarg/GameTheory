name: Export agent source

on:
  pull_request:
    branches: [uniform-existence]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bundle source
        run: tar --exclude=.git --exclude=.lake -czf "$RUNNER_TEMP/GameTheory-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: GameTheory-source
          path: ${{ runner.temp }}/GameTheory-source.tar.gz
          retention-days: 1
