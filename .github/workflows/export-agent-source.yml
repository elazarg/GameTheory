name: Apply punishment-completed cycle source

on:
  push:
    branches: [agent/punishment-completed-cycles]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/punishment-completed-cycles
      - name: Decode generated Lean source
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/cycle.b64" <<'PAYLOAD'

PAYLOAD
          mkdir -p GameTheory/Concepts/Stochastic
          base64 -d "$RUNNER_TEMP/cycle.b64" | gzip -d > GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add punishment-completed cycle compiler"
          git push origin HEAD:agent/punishment-completed-cycles
