name: Uniform consequence branch CI

on:
  push:
    branches: [agent/uniform-equilibrium-consequences]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: uniform-consequence-branch-ci
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build consequence entry point
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build +GameTheory.Concepts.Stochastic.UniformConsequences 2>&1 | tee /tmp/consequence-build.log

      - name: Check proof placeholders
        id: placeholders
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/check_lean_placeholders.py

      - name: Report result on PR 22
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PLACEHOLDER_OUTCOME: ${{ steps.placeholders.outcome }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "### Temporary focused Lean CI"
            echo
            echo "- head: \`$HEAD_SHA\`"
            echo "- consequence build: **$BUILD_OUTCOME**"
            echo "- placeholder audit: **$PLACEHOLDER_OUTCOME**"
            echo
            echo "<details><summary>Build tail</summary>"
            echo
            echo '```text'
            tail -n 160 /tmp/consequence-build.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } > /tmp/comment.md
          gh pr comment 22 --repo elazarg/GameTheory --body-file /tmp/comment.md
          test "$BUILD_OUTCOME" = success
          test "$PLACEHOLDER_OUTCOME" = success
