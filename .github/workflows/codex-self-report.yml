name: Codex self-reporting Lean validation

on:
  push:
    branches:
      - codex/multi-owner-circulation-path
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true
      - name: Build and collect diagnostics
        id: lean
        shell: bash
        run: |
          set +e
          lake build > /tmp/codex-lean.log 2>&1
          build_status=$?
          python3 scripts/check_lean_placeholders.py >> /tmp/codex-lean.log 2>&1
          placeholder_status=$?
          if [[ $build_status -eq 0 && $placeholder_status -eq 0 ]]; then
            echo success > /tmp/codex-status
          else
            echo failure > /tmp/codex-status
          fi
          exit 0
      - name: Report result on PR 25
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat /tmp/codex-status)
          {
            echo "<!-- codex-circulation-ci -->"
            echo "### Lean validation: **${status}**"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            tail -c 50000 /tmp/codex-lean.log
            echo
            echo '```'
          } > /tmp/codex-comment.md
          gh pr comment 25 --body-file /tmp/codex-comment.md
          test "$status" = success
