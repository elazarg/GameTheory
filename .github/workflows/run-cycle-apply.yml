name: Run cycle source apply

on:
  pull_request:
    branches: [uniform-existence]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/punishment-completed-cycles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Decode generated Lean source
        shell: bash
        run: |
          sed -n '/^H4sI/,/^PAYLOAD$/p' .github/workflows/export-agent-source.yml | sed '$d' > "$RUNNER_TEMP/cycle.b64"
          mkdir -p GameTheory/Concepts/Stochastic
          base64 -d "$RUNNER_TEMP/cycle.b64" | gzip -d > GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add punishment-completed cycle compiler"
          git push origin HEAD:agent/punishment-completed-cycles
