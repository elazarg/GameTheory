name: Apply punishment-completed cycle fixes

on:
  pull_request:
    branches: [uniform-existence]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/punishment-completed-cycles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch Lean source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean')
          text = path.read_text()

          replacements = [
              (
                  'open StochasticGame Filter Math.Probability Math.PMFProduct\n\nvariable {K : ℕ}',
                  'open StochasticGame Filter Math.Probability Math.PMFProduct\nopen QuittingSureSetOwnerRepair\n\nvariable {K : ℕ}',
                  2,
              ),
              ('  push_neg at hnone', '  push Not at hnone', 1),
              (
                  '  have hstage : ∀ time, time < cutoff,\n      quittingRootAbsorbingContribution',
                  '  have hstage : ∀ time, time < cutoff →\n      quittingRootAbsorbingContribution',
                  1,
              ),
              (
                  '  unfold quittingJointSurvivalWeight quittingCyclicPrefixWeight\n  apply Finset.prod_congr rfl',
                  '  rw [quittingJointSurvivalWeight_eq_prod]\n  unfold quittingCyclicPrefixWeight\n  apply Finset.prod_congr rfl',
                  1,
              ),
              (
                  '  dsimp only [pathValue] at htransport\n  rw [quittingCyclicOrbit_zero, quittingCyclicOrbit_card, hprod] at htransport',
                  '  dsimp only [pathValue] at htransport\n  simp only [zero_add, quittingCyclicOrbit_card] at htransport\n  rw [hprod] at htransport',
                  1,
              ),
              (
                  '  exact mul_le_mul_of_nonneg_left htail hsurvival0\n\n/-- Hazard-level suffix replacement.',
                  '  simpa [mul_comm, mul_left_comm, mul_assoc] using\n    (mul_le_mul_of_nonneg_left htail hsurvival0)\n\n/-- Hazard-level suffix replacement.',
                  1,
              ),
              (
                  '    refine ⟨profile, hzero.mono hε.le, ?_⟩',
                  '    refine ⟨profile, hzero.mono (by simpa using hε.le), ?_⟩',
                  1,
              ),
              (
                  '                dsimp only [plan]\n                simpa using hbase)',
                  '                dsimp only [plan]\n                simpa only [quittingRootSequenceTerminalValue_cyclic_eq,\n                  quittingCyclicOrbit_zero] using hbase)',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'expected {expected} occurrence(s), found {actual}: {old[:80]!r}')
              text = text.replace(old, new, expected)

          path.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameTheory/Concepts/Stochastic/QuittingPunishmentCompletedCycle.lean
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix punishment-completed cycle compiler"
          git push origin HEAD:agent/punishment-completed-cycles
