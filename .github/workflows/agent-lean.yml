name: Agent Lean validation

on:
  push:
    branches:
      - agent/quitting-target-tail
  pull_request:
    branches:
      - uniform-existence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Lean and cache dependencies
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true

      - name: Restore branch-local project build cache
        id: project-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Compile target-closed tails
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingTargetAnchoredTail

      - name: Compile arbitrary-endpoint factory
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingFiniteEndpointNashBellmanFactory

      - name: Compile diagonal semantics
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailSemantics

      - name: Compile diagonal bounds
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailBounds

      - name: Compile exceptional selector
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailSelection

      - name: Compile final compiler
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTail

      - name: Save branch-local project build cache
        if: always() && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
