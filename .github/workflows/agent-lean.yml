name: Agent Lean validation

on:
  push:
    branches:
      - agent/quitting-target-tail
  pull_request:
    branches:
      - uniform-existence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/quitting-target-tail
          submodules: recursive

      - name: Finish the final scaling proof
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTail.lean")
          text = path.read_text()
          start_marker = "  have hscale : 4 * M * δ ≤ ε := by\n"
          end_marker = "  exact ⟨profile, hprofile.mono hscale⟩\n"
          start = text.rfind(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("final scaling block was not found")
          replacement = (
              "  have hscale : 4 * M * δ ≤ ε := by\n"
              "    change 4 * M * (ε / (4 * M + 1)) ≤ ε\n"
              "    rw [← mul_div_assoc, div_le_iff₀ hdenom]\n"
              "    nlinarith [hε.le]\n"
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTail.lean
          git commit -m "Fix the diagonal target-tail scaling indentation"
          git push origin HEAD:agent/quitting-target-tail

      - name: Set up Lean and cache dependencies
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true

      - name: Restore branch-local project build cache
        id: project-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Compile target-closed tails
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingTargetAnchoredTail

      - name: Compile arbitrary-endpoint factory
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingFiniteEndpointNashBellmanFactory

      - name: Compile diagonal semantics
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailSemantics

      - name: Compile diagonal bounds
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailBounds

      - name: Compile exceptional selector
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailSelection

      - name: Compile final compiler
        run: timeout 180s lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTail

      - name: Compile aggregate library
        run: timeout 900s lake build GameTheory

      - name: Save branch-local project build cache
        if: always() && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: target-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
