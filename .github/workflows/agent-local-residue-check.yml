name: Agent local residue Lean check

on:
  push:
    branches:
      - agent/local-residue-double-sure-mixer
  pull_request:
    branches:
      - uniform-existence
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply connector proof patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('GameTheory/Concepts/Stochastic/QuittingLocalMechanismResidueWitness.lean')
          s = p.read_text()
          replacements = [
          ('''  fin_cases owner
          · by_cases h : p ≤ 2 / 5
            · refine ⟨2, by decide, ?_⟩
              rw [switchingResidual_02]
              linarith
            · refine ⟨1, by decide, ?_⟩
              rw [switchingResidual_01]
              linarith
          · refine ⟨0, by decide, ?_⟩
            rw [switchingResidual_10]
            norm_num
          · refine ⟨0, by decide, ?_⟩
            rw [switchingResidual_20]
            norm_num
          ''', '''  fin_cases owner
          · by_cases h : p ≤ 2 / 5
            · refine ⟨2, by decide, ?_⟩
              simp [switchingResidual, solo, reward]
              linarith
            · refine ⟨1, by decide, ?_⟩
              simp [switchingResidual, solo, reward]
              linarith
          · refine ⟨0, by decide, ?_⟩
            simp [switchingResidual, solo, reward]
          · refine ⟨0, by decide, ?_⟩
            simp [switchingResidual, solo, reward]
          '''),
          ('''  simp [reward]
            norm_num

          private theorem collision_owner_loss_21''', '''  simp [reward]

          private theorem collision_owner_loss_21'''),
          ('''  unfold QuittingCollisionSpectatorNoJoin at hspectator
          ''', ''''''),
          ('''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            norm_num [reward] at hspectator

          /-- `(owner, blocker) = (0,2)`:''', '''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            change (1 : ℝ) ≤ 0 at hspectator
            norm_num at hspectator

          /-- `(owner, blocker) = (0,2)`:'''),
          ('''  rw [quittingCollisionRepairValue_apply] at hbalance
            simp only [quittingSetReward_gameReward] at hbalance
            norm_num [reward] at hbalance

          /-- `(owner, blocker) = (1,0)`:''', '''  rw [quittingCollisionRepairValue_apply] at hbalance
            simp only [quittingSetReward_gameReward] at hbalance
            change (2 / 5 : ℝ) ≤ 0 at hbalance
            norm_num at hbalance

          /-- `(owner, blocker) = (1,0)`:'''),
          ('''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            norm_num [reward] at hspectator

          /-- `(owner, blocker) = (1,2)`:''', '''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            change (1 : ℝ) ≤ 0 at hspectator
            norm_num at hspectator

          /-- `(owner, blocker) = (1,2)`:'''),
          ('''  rw [quittingCollisionRepairValue_apply] at hbalance
            simp only [quittingSetReward_gameReward] at hbalance
            norm_num [reward] at hbalance

          /-- `(owner, blocker) = (2,0)`:''', '''  rw [quittingCollisionRepairValue_apply] at hbalance
            simp only [quittingSetReward_gameReward] at hbalance
            change (1 : ℝ) ≤ 0 at hbalance
            norm_num at hbalance

          /-- `(owner, blocker) = (2,0)`:'''),
          ('''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            norm_num [reward] at hspectator

          /-- `(owner, blocker) = (2,1)`:''', '''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            change (1 : ℝ) ≤ 2 / 5 at hspectator
            norm_num at hspectator

          /-- `(owner, blocker) = (2,1)`:'''),
          ('''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            norm_num [reward] at hspectator

          /-- All six ordered sure-blocker collision mechanisms fail. -/''', '''  rw [quittingCollisionRepairValue_apply] at hspectator
            simp only [quittingSetReward_gameReward] at hspectator
            change (1 : ℝ) ≤ 0 at hspectator
            norm_num at hspectator

          /-- All six ordered sure-blocker collision mechanisms fail. -/'''),
          ('''    norm_num [doubleSureMixerValue, quittingSureSetOwnerValue,
              quittingSetReward_gameReward, reward]''', '''    norm_num [doubleSureMixerValue, quittingSureSetOwnerValue,
              gameReward, reward]'''),
          ('''    norm_num [quittingSureSetOwnerExactCap, quittingSureSetOwnerValue,
              quittingSetReward_gameReward, reward]''', '''    norm_num [quittingSureSetOwnerExactCap, quittingSureSetOwnerValue,
              gameReward, reward]'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'patch fragment not found:\n{old[:160]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GameTheory/Concepts/Stochastic/QuittingLocalMechanismResidueWitness.lean
          git commit -m 'Repair local residue witness elaboration'
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build residue witness
        id: witness
        shell: bash
        run: |
          set +e
          lake build GameTheory.Concepts.Stochastic.QuittingLocalMechanismResidueWitness 2>&1 | tee residue-build.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report Lean result on PR 5
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ steps.witness.outputs.status }}
        shell: bash
        run: |
          {
            echo "### Automated Lean check"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Exit status: \`${BUILD_STATUS}\`"
            echo
            echo '```text'
            tail -c 60000 residue-build.log
            echo '```'
          } > residue-comment.md
          gh pr comment 5 --repo "${GITHUB_REPOSITORY}" --body-file residue-comment.md
      - name: Fail after reporting
        if: steps.witness.outputs.status != '0'
        run: exit 1
