name: Lean CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  propagate-punishment-pipeline:
    name: Propagate punishment pipeline
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/punishment-completed-cycles'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply propagation and remove bootstrap files
        shell: bash
        run: |
          python3 .github/propagate_punishment.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write\n',
                              'permissions:\n  contents: read\n', 1)
          start = text.index('  propagate-punishment-pipeline:\n')
          end = text.index('  fast-pr:\n', start)
          path.write_text(text[:start] + text[end:])
          PY

          git rm .github/propagate_punishment.py \
            .github/punishment-pipeline-propagation.patch.gz.b64 \
            .github/workflows/propagate-punishment-pipeline.yml
          git add .github/workflows/ci.yml \
            docs/uniform-equilibrium/FRONTIER.md \
            docs/uniform-equilibrium/TOOLKIT.md \
            docs/uniform-equilibrium/PIPELINE.md \
            docs/uniform-equilibrium/PIPELINE-Archive.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Propagate punishment-completed branch implications'
          git push origin HEAD:agent/punishment-completed-cycles

  fast-pr:
    name: Fast PR check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject proof placeholders
        run: python3 scripts/check_lean_placeholders.py

      - name: Select Lean build scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode="$(python3 scripts/ci_changed_lean_targets.py --mode "$BASE_SHA" "$HEAD_SHA")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Lean build mode: $mode"

      - name: Initialize Lean submodules
        if: steps.scope.outputs.mode != 'none'
        run: git submodule update --init --recursive

      - name: Set up Lean and restore caches
        if: steps.scope.outputs.mode != 'none'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          # Distinct from Mathlib's cache: persist this checkout's `.lake`,
          # including GameTheory `.olean` files, across PR commits.
          use-github-cache: true

      - name: Build changed Lean modules
        if: steps.scope.outputs.mode == 'focused'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mapfile -t targets < <(
            python3 scripts/ci_changed_lean_targets.py --targets "$BASE_SHA" "$HEAD_SHA"
          )
          printf 'Building %s\n' "${targets[*]}"
          lake build "${targets[@]}"

      - name: Build all Lean libraries after structural changes
        if: steps.scope.outputs.mode == 'full'
        run: lake build

  full:
    name: Full build and audit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Lean libraries
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Check for proof placeholders
        run: python3 scripts/check_lean_placeholders.py

      - name: Audit repository and theorem axioms
        run: python3 scripts/audit_repository.py
