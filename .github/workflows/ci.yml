name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and audit
    runs-on: windows-latest
    # Allow a cold build followed by whole-library lint and axiom checks.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Compile every public module and all validation evidence before the
      # cache is saved. Ordinary local builds only follow the public umbrellas.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          build-args: '--iofail GameTheory GameTheory.Math GameTheory.LintAll GameTheory.AxiomAudit'
          test: false
          lint: false
          use-mathlib-cache: true

      # lean-action's internal Bash steps can see Elan, but on Windows its
      # shim directory is not currently propagated to later PowerShell steps.
      # The audit invokes Lake, so expose the pinned shims once
      # and fail here with a useful message if the action layout changes.
      - name: Expose pinned Lean toolchain to audit steps
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          $lake = Join-Path $elanBin 'lake.exe'
          if (-not (Test-Path -LiteralPath $lake -PathType Leaf)) {
            throw "lean-action did not install the Lake shim at $lake"
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify tooling regression tests
        run: python -m unittest discover -s scripts/tests

      - name: Audit the library with warnings and info as errors
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v\d+\.') {
            python scripts/audit.py --release-version $env:GITHUB_REF_NAME
          } else {
            python scripts/audit.py
          }

      - name: Verify build and audits do not mutate tracked files
        run: git diff --exit-code
