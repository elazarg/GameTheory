name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-history:
    name: Export source and Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: tar -czf /tmp/gametheory-history.tgz .git
      - uses: actions/upload-artifact@v4
        with:
          name: gametheory-history
          path: /tmp/gametheory-history.tgz

  verify:
    name: Build and architecture audits
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # lean-action reads the repository's pinned lean-toolchain.  The build is
      # selected explicitly rather than inferred, and runs before the action
      # saves its `.lake` cache.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      # lean-action's internal Bash steps can see Elan, but on Windows its
      # shim directory is not currently propagated to later PowerShell steps.
      # The deep audits invoke `lake env lean`, so expose the pinned shims once
      # and fail here with a useful message if the action layout changes.
      - name: Expose pinned Lean toolchain to audit steps
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          $lake = Join-Path $elanBin 'lake.exe'
          if (-not (Test-Path -LiteralPath $lake -PathType Leaf)) {
            throw "lean-action did not install the Lake shim at $lake"
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Source-level checks stay fast for local iteration. CI additionally
      # exercises the intentionally expensive compiler reachability probes.
      - name: Verify Phase 1 architecture measurements
        run: ./scripts/phase1-audit.ps1 -VerifyExpected

      - name: Verify Phase 2 architecture measurements and reachability probes
        run: ./scripts/phase2-audit.ps1 -VerifyExpected -DeepReachability

      - name: Verify Phase 3 architecture measurements and reachability probes
        run: ./scripts/phase3-audit.ps1 -VerifyExpected -DeepReachability

      - name: Verify build and audits do not mutate tracked files
        run: git diff --exit-code
