name: Finalize punishment-completed cycles

on:
  push:
    branches:
      - agent/punishment-completed-cycles

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/punishment-completed-cycles
          fetch-depth: 0

      - name: Integrate theorem surface and documentation
        shell: bash
        run: |
          if grep -q 'import GameTheory.Concepts.Stochastic.QuittingCoupledPhaseSwitchCap' GameTheory.lean; then
            echo 'Integration already applied.'
            exit 0
          fi
          git apply --index .github/punishment-integration.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate punishment-completed cycle compiler'
          git push origin HEAD:agent/punishment-completed-cycles
