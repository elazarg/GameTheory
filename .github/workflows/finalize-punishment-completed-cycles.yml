name: Finalize punishment-completed cycles

on:
  push:
    branches:
      - agent/punishment-completed-cycles

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/punishment-completed-cycles
          fetch-depth: 0

      - name: Integrate theorem surface and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(text: str, anchor: str, addition: str) -> str:
              if addition.strip() in text:
                  return text
              if anchor not in text:
                  raise RuntimeError(f"missing insertion anchor: {anchor!r}")
              return text.replace(anchor, anchor + addition, 1)

          def replace_section(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          root = Path("GameTheory.lean")
          text = root.read_text()
          text = insert_after(
              text,
              "import GameTheory.Concepts.Stochastic.QuittingPhaseSwitchDeviationCap\n",
              "import GameTheory.Concepts.Stochastic.QuittingCoupledPhaseSwitchCap\n",
          )
          text = insert_after(
              text,
              "import GameTheory.Concepts.Stochastic.QuittingCollisionRepairCharacterization\n",
              "import GameTheory.Concepts.Stochastic.QuittingInstantPunishment\n"
              "import GameTheory.Concepts.Stochastic.QuittingPunishmentCompletedCycle\n",
          )
          root.write_text(text)

          audit = Path("scripts/AxiomAudit.lean")
          text = audit.read_text()
          text = insert_after(
              text,
              "#print axioms GameTheory.quittingGame_exists_uniformEquilibriumPayoff_of_terminalNash_all_errors\n",
              "#print axioms GameTheory.quittingGame_isUniformEquilibriumPayoff_of_terminalNash_all_errors_fixedTarget\n"
              "#print axioms GameTheory.quittingGame_isUniformEquilibriumPayoff_of_terminalNash_all_errors_approxTarget\n",
          )
          text = insert_after(
              text,
              "#print axioms GameTheory.quittingGame_exists_uniformEquilibriumPayoff_iff_terminalNash_all_errors\n",
              "\n-- Coupled phase switching, exact instant punishment, and punishment-completed\n"
              "-- absorbing cycles.\n"
              "#print axioms GameTheory.quittingRootSequenceHazardTerminalValue_quittingPhaseSwitchRoots_le_coupled\n"
              "#print axioms GameTheory.quittingInstantPunishmentWorks_iff\n"
              "#print axioms GameTheory.isUniformEquilibriumPayoff_soloReward_of_instantPunishment\n"
              "#print axioms GameTheory.isUniformEquilibriumPayoff_of_punishmentAdmissibleCycle\n"
              "#print axioms GameTheory.isUniformEquilibriumPayoff_terminal_of_punishmentAdmissibleBlock\n",
          )
          audit.write_text(text)

          toolkit = Path("docs/uniform-equilibrium/TOOLKIT.md")
          text = toolkit.read_text()
          old = "| Quitting terminal selection | `QuittingTerminalUniformPayoffSelection.lean` | The equivalence between terminal approximate Nash existence at every accuracy and uniform-payoff existence for finite quitting games. |"
          new = "| Quitting terminal selection | `QuittingTerminalUniformPayoffSelection.lean` | Target-free compact selection, fixed-target and convergent-target terminal selection, and the equivalence between terminal approximate Nash existence at every accuracy and uniform-payoff existence for finite quitting games. |\n| Instant and cycle punishment | `QuittingInstantPunishment.lean`, `QuittingPunishmentCompletedCycle.lean` | The exact instant-equilibrium criterion, coupled negative-anchor phase switching, and punishment completion of the isolated coordinate of an absorbing cycle. |"
          if old not in text:
              raise RuntimeError("missing toolkit terminal-selection row")
          text = text.replace(old, new, 1)
          old = "| Finite admissible cycle | A realized admissible absorbing cyclic continuation block | A terminal equilibrium and uniform payoff | The cycle disjunct is not exhaustive for all quitting games. |"
          new = "| Punishment-completed finite cycle | An exact absorbing cyclic continuation block such that every coordinate either has contracting deleted survival or has punishment value at most its singleton payoff | Accuracy-indexed terminal equilibria converging to the named cycle value, hence that value is a uniform-equilibrium payoff | Does not produce an exact cycle; weights with no exact complementary cycle remain outside this carrier. |"
          if old not in text:
              raise RuntimeError("missing toolkit cycle row")
          toolkit.write_text(text.replace(old, new, 1))

          frontier = Path("docs/uniform-equilibrium/FRONTIER.md")
          text = frontier.read_text()
          text = replace_section(
              text,
              "The trichotomy leaves **two holes**, and these are the open content:",
              "No bound on the length is required:",
              """The trichotomy's **isolated-negative compiler hole is closed**.  The passive
periodic profile was the wrong object: it implicitly assigns continuation value
`0` when the isolated player refuses to quit.  `QuittingInstantPunishment.lean`
proves the exact replacement for a sure first-stage quitter,

```text
quittingPunishmentValue reward i ≤ r_i({i})
```

together with the outsider no-join inequalities.  The continuation may be a
near-optimal constant punishment row because
`quittingPunishmentValue_eq_stationaryPunishmentValue` identifies the full
behavioral min-max with the infimum of stationary stopping caps.
`QuittingPunishmentCompletedCycle.lean` then extends this to every exact
absorbing cycle: each coordinate must either have deleted survival product
below one, or have punishment value at most its singleton payoff.  Absorption
allows at most one noncontracting coordinate; a long cyclic prefix followed by
its punishment gives terminal approximate equilibria converging to the named
cycle value.  The older nonnegative-solo admissibility predicate is a strict
special case.

One cycle-carrier hole remains.  The trichotomy is exhaustive only under the
hypothesis that the weight admits an absorbing complementary cycle **at all**.
Weights admitting none of any period are outside it entirely. **This hole is
occupied, and the occupancy is machine-checked end to end (`L`)**: for every
`ε ∈ (0, 2]`, `¬∃ terminal, IsQuittingCyclicContinuation (ftvRewardEps ε)
terminal` — the trichotomy's own predicate — via the label lock in the real
encoding (all periods, with the `ε = 0` rotation as the in-file boundary
witness) and the cycle-level transport with entry-for-entry weight alignment
(`PerturbedCyclicWeightNoExactCycle.lean`,
`PerturbedCyclicWeightCycleExistenceHoleOccupied.lean`). The leading hard
candidate provably lies *outside the trichotomy*; the cycle route's
incompleteness is an internal theorem, and the published Theorem 2.1 is
independent confirmation only.

""",
          )
          text = replace_section(
              text,
              "A concrete family falls through every split the program has.",
              "**The punishment target is no longer inexpressible",
              """The formerly missing *instant* profile shape is now represented and
characterized exactly.  `quittingOneStagePunishedProfile` plays a supplied row
at stage zero and, after unexpected survival, restarts a punishment row;
`QuittingCoupledPhaseSwitchCap.lean` keeps the survival coefficient attached to
the negative continuation anchor instead of first replacing it by `0`.
`QuittingInstantPunishment.lean` proves that a sure solo quitter `i` works at
all accuracies iff its singleton payoff dominates its exact punishment value
and every outsider weakly prefers not to join the exit.  Negative singleton
payoffs are therefore no longer excluded merely because the passive
continuation value is `0`.

This closes a profile-grammar blind spot, but not the arbitrary-game producer.
The optimized-debt and exact-cycle splits still do not prove that every game
supplies either an instant certificate or a punishment-admissible exact cycle.

""",
          )
          text = replace_section(
              text,
              "The folk bill is now two-thirds closed, superseding the previous paragraph",
              "**And the first capstone exists**",
              """The folk bill is now two-thirds closed, superseding the previous paragraph
here. **The floor landed** (`QuittingPunishmentFloor.lean`): the naive floor
refuted first, the unconditional floor `max{(T−1)/T·mIn, mOut}`, the
sandwich converging to `max 0 (solo)` under two finitely-checkable table
conditions, exactness on the hostile witness — and **the no-go generator
refutes for the first time**: the zero payoff is not a uniform equilibrium
payoff of the quit-bonus table, margin `1/4` from horizon `4`. **The
feasible set landed** (`Feasible.lean`): finite-horizon and asymptotic,
composed with IR into the full necessary direction, with the non-convexity
fence (`(p−q)² = −1`) proving the classical folk hypothesis shape false for
this model at horizon one. What remains of the general folk bill is narrower.
Single-player punishment attainment is settled in the form actually needed
here: every positive tolerance has a constant product row whose stopping cap
is within that tolerance of the exact behavioral punishment value. Instant
profiles and the unique isolated coordinate of an absorbing cycle now feed
explicit all-errors families into target-identified terminal selection. Still
open are simultaneous/shared punishment requirements, hull attainability (the
model lacks public randomization — and note the padding separation proves
padding *smuggles it in*: the XOR lottery attains a non-product point, so
padding strictly enlarges the feasible set, not merely the equilibrium set),
and a generic producer showing that arbitrary games reach one of the accepted
certificate classes. The capping theorem for the planned-survival stopping
index remains a separate conditional engine.

""",
          )
          frontier.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameTheory.lean scripts/AxiomAudit.lean \
            docs/uniform-equilibrium/TOOLKIT.md \
            docs/uniform-equilibrium/FRONTIER.md
          git commit -m "Integrate punishment-completed cycle compiler"
          git push origin HEAD:agent/punishment-completed-cycles
