name: Target-anchored tail proof

on:
  pull_request:
    branches:
      - uniform-existence
    paths:
      - '.github/workflows/target-anchored-tail.yml'
      - 'GameTheory/Concepts/Stochastic/QuittingTargetAnchoredTail.lean'
      - 'GameTheory/Concepts/Stochastic/QuittingFiniteEndpointNashBellmanFactory.lean'
      - 'GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTail.lean'
      - 'GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTailSplice.lean'
      - 'GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTailCompiler.lean'
      - 'GameTheory/Concepts/Stochastic/QuittingDiagonalTargetTailCertificate.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

concurrency:
  group: target-anchored-tail-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lean and restore caches
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Compile the complete target-tail dependency chain
        run: lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailCertificate

      - name: Audit target-tail theorem axioms
        run: |
          cat > /tmp/QuittingDiagonalTargetTailAxiomAudit.lean <<'EOF'
          import GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailCertificate
          #print axioms GameTheory.exists_exceptionalTarget_of_pairwise_mul_le_joint
          #print axioms GameTheory.exists_stationaryDiagonalTargetTailSkeleton
          #print axioms GameTheory.quittingPrefixThenTailHazardGap_le_survival_debt_sub_joint_mismatch
          #print axioms GameTheory.exists_quittingExceptionalTarget_of_jointSurvivalWeight_le_sq
          #print axioms GameTheory.exists_target_quittingPrefixThenTail_isεAsymptoticNash
          #print axioms GameTheory.quittingGame_exists_uniformEquilibriumPayoff_of_hasDiagonalTargetTailCertificates
          EOF
          lake env lean /tmp/QuittingDiagonalTargetTailAxiomAudit.lean | tee /tmp/target-tail-axioms.log
          if grep -q sorryAx /tmp/target-tail-axioms.log; then
            echo "Target-tail theorem unexpectedly depends on sorryAx" >&2
            exit 1
          fi

      - name: Check proof placeholders
        run: python3 scripts/check_lean_placeholders.py
