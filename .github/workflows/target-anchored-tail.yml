name: Target-anchored tail proof

on:
  push:
    branches:
      - codex/target-anchored-tail
      - codex/target-anchored-tail-ci
  pull_request:
    branches:
      - uniform-existence
      - codex/target-anchored-tail
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lean and dependencies
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true

      - name: Compile target-tail modules
        run: |
          lake build GameTheory.Concepts.Stochastic.QuittingTargetAnchoredTail
          lake build GameTheory.Concepts.Stochastic.QuittingFiniteEndpointNashBellmanFactory
          lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTail
          lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailSplice
          lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailCompiler
          lake build GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailCertificate

      - name: Compile repository integration target
        run: lake build GameTheoryTest

      - name: Audit target-tail theorem axioms
        run: |
          cat > /tmp/QuittingDiagonalTargetTailAxiomAudit.lean <<'EOF'
          import GameTheory.Concepts.Stochastic.QuittingDiagonalTargetTailCertificate
          #print axioms GameTheory.exists_exceptionalTarget_of_pairwise_mul_le_joint
          #print axioms GameTheory.exists_stationaryDiagonalTargetTailSkeleton
          #print axioms GameTheory.quittingPrefixThenTailHazardGap_le_survival_debt_sub_joint_mismatch
          #print axioms GameTheory.exists_quittingExceptionalTarget_of_jointSurvivalWeight_le_sq
          #print axioms GameTheory.exists_target_quittingPrefixThenTail_isεAsymptoticNash
          #print axioms GameTheory.quittingGame_exists_uniformEquilibriumPayoff_of_hasDiagonalTargetTailCertificates
          EOF
          lake env lean /tmp/QuittingDiagonalTargetTailAxiomAudit.lean | tee /tmp/target-tail-axioms.log
          if grep -q sorryAx /tmp/target-tail-axioms.log; then
            echo "Target-tail theorem unexpectedly depends on sorryAx" >&2
            exit 1
          fi

      - name: Check proof placeholders
        run: python3 scripts/check_lean_placeholders.py

      - name: Build public library for repository audit
        run: lake build GameTheory

      - name: Audit reachability and theorem axioms
        run: python3 scripts/audit_repository.py
