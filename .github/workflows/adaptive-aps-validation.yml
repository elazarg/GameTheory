name: Adaptive essential-APS validation

on:
  push:
    branches:
      - agent/adaptive-essential-aps-mesh-ci
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: adaptive-essential-aps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Build adaptive APS compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reject proof placeholders
        run: python3 scripts/check_lean_placeholders.py

      - name: Set up Lean and restore caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build adaptive APS compiler modules
        run: |
          lake build \
            GameTheory.Concepts.Stochastic.QuittingInfinitePathSupersolution \
            GameTheory.Concepts.Stochastic.QuittingVariableMeshSchedule \
            GameTheory.Concepts.Stochastic.QuittingVariableSingletonMesh \
            GameTheory.Concepts.Stochastic.QuittingEssentialAPSUniformPayoff \
            GameTheory.Concepts.Stochastic.QuittingEssentialAPSAll

      - name: Report validation result on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          body=$(cat <<EOF
          <!-- adaptive-essential-aps-ci -->
          **Adaptive essential-APS Lean validation: ${JOB_STATUS}**

          - commit: \`${HEAD_SHA}\`
          - workflow run: \`${RUN_ID}\` (attempt ${RUN_ATTEMPT})
          - placeholder audit and all five changed Lean modules are included in this job
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/26/comments" -f body="$body"
