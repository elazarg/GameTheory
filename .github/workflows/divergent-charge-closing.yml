name: Validate divergent-charge closing

on:
  push:
    branches:
      - agent/divergent-charge-closing

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true
      - name: Build and collect diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/divergent-charge-closing.log
          overall=0
          lake build Math.DivergentChargeRecurrence \
            >> /tmp/divergent-charge-closing.log 2>&1 || overall=1
          python3 scripts/check_lean_placeholders.py \
            >> /tmp/divergent-charge-closing.log 2>&1 || overall=1
          if [[ $overall -eq 0 ]]; then
            echo success > /tmp/divergent-charge-closing-status
          else
            echo failure > /tmp/divergent-charge-closing-status
          fi
          exit 0
      - name: Report result on PR 41
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat /tmp/divergent-charge-closing-status 2>/dev/null || echo failure)
          {
            echo '<!-- divergent-charge-closing-ci -->'
            echo "### Lean validation: **${status}**"
            echo
            echo "Checked commit \`$(git rev-parse HEAD)\`."
            echo
            echo '```text'
            tail -c 50000 /tmp/divergent-charge-closing.log 2>/dev/null || true
            echo
            echo '```'
          } > /tmp/divergent-charge-closing-comment.md
          gh pr comment 41 --body-file /tmp/divergent-charge-closing-comment.md
          test "$status" = success
