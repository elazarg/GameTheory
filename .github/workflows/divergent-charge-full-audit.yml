name: Validate divergent-charge full audit

on:
  push:
    branches:
      - agent/divergent-charge-closing

permissions:
  contents: read
  issues: write

jobs:
  full:
    name: Full build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Lean libraries
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Check for proof placeholders
        run: python3 scripts/check_lean_placeholders.py

      - name: Audit repository and theorem axioms
        run: python3 scripts/audit_repository.py

      - name: Report result on PR 41
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh pr comment 41 --body "<!-- divergent-charge-full-audit -->
          ### Full build and repository audit: **${STATUS}**

          Commit: \`${GITHUB_SHA}\`
          Run: \`${GITHUB_RUN_ID}\`"
