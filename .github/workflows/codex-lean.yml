name: Codex Lean branch check

on:
  push:
    branches:
      - codex/multi-owner-circulation-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
      - name: Check proof placeholders
        run: python3 scripts/check_lean_placeholders.py
